name: Build MyLOGGER1.0 PRO APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'MyLOGGER1-Android/**'
      - '.github/workflows/build-mylogger-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build debug APK
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: '8.9'
          build-root-directory: MyLOGGER1-Android
          arguments: assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MyLOGGER1-PRO-APK
          path: MyLOGGER1-Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

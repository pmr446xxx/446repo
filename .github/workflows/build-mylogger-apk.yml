name: Build MyLOGGER1.0 PRO APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-mylogger-apk.yml'

permissions:
  contents: read

jobs:
  runner-diagnostic:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm hosted runner starts
        run: |
          echo "RUNNER_STARTED_OK"
          uname -a

name: Deploy CLUSTER BY KALBAR

on:
  push:
    branches:
      - main
    paths:
      - "dxcluster-live/**"
      - ".github/workflows/pages-dxcluster.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload DX Cluster website
        uses: actions/upload-pages-artifact@v4
        with:
          path: dxcluster-live

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
